; =====================================================================
;  AQI Monitor - ESP32 (PlatformIO)
;
;  Environments:
;    main                    -> full firmware (all sensors)          [default]
;    test_temperature        -> DS18B20 only   (bring-up / wiring check)
;    test_gas                -> MQ-135 only    (bring-up / wiring check)
;    test_pressure_humidity  -> BME280 only    (bring-up / wiring check)
;
;  Build + upload + monitor one env:
;    pio run -e test_temperature -t upload -t monitor
; =====================================================================

[platformio]
default_envs = main

; ---------- Shared settings (inherited by every env) ----------
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
build_flags =
    -D CORE_DEBUG_LEVEL=3        ; 0=none 1=error 2=warn 3=info 4=debug 5=verbose
    -Wall
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; ---------- Production firmware ----------
[env:main]
build_src_filter = +<*> -<sensor_tests/> -<examples/>

; ---------- Per-sensor bring-up firmwares ----------
[env:test_temperature]
build_src_filter = +<sensor_tests/test_temperature.cpp>

[env:test_gas]
build_src_filter = +<sensor_tests/test_gas.cpp>

[env:test_pressure_humidity]
build_src_filter = +<sensor_tests/test_pressure_humidity.cpp>

; ---------- Hello World (toolchain / board sanity check) ----------
[env:hello_world]
build_src_filter = +<examples/hello_world.cpp>
lib_deps =
